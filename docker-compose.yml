version: '3'

services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-loved}
            POSTGRES_USER: ${POSTGRES_USER:-loved}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loved}
        ports:
            - 5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    postgres-data:
